# Builds an unsigned iOS .ipa on a GitHub-hosted Mac, so the app can be
# sideloaded (re-signed with a free Apple ID) without owning a Mac.
# Run it from the Actions tab ("Run workflow") and download the artifact.
name: iOS build (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr insta_playlist-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: insta_playlist-unsigned-ipa
          path: insta_playlist-unsigned.ipa
          retention-days: 14
